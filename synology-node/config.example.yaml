# =============================================================================
# 3x-ui + Tailscale node — declarative configuration
# Copy to config.yaml and fill in. Mounted read-only at /config/config.yaml.
# =============================================================================

node:
  name: "synology-xray"

tailscale:
  enabled: true
  # userspace: no /dev/net/tun, no NET_ADMIN; local SOCKS5 for Xray
  # kernel:    uses TUN + host networking (needs privileges, faster)
  mode: userspace
  # Create at https://login.tailscale.com/admin/settings/keys
  auth_key: "tskey-auth-REPLACE_ME"
  hostname: "synology-xray"
  # 62yun-vps (Madrid). Must be approved as exit node in the Tailscale admin.
  exit_node: "100.116.29.54"
  # Fixed WireGuard/disco UDP port. Forward it on the router and map it in Docker.
  port: 41641
  socks_port: 1055
  state_dir: "/var/lib/tailscale"
  accept_routes: false
  exit_node_allow_lan_access: false
  advertise_routes: []
  advertise_exit_node: false

panel:
  listen: "0.0.0.0"
  port: 2053
  username: "admin"
  password: "change-me"
  web_base_path: "/"
  # Optional panel TLS (mount certs under /config/certs):
  # cert_file: "/config/certs/panel.crt"
  # key_file:  "/config/certs/panel.key"

vless:
  port: 10890
  # Port clients actually use (router forward -> vless.port)
  external_port: 10890
  # Public domain/IP used in client links (Synology DDNS, DuckDNS, ...)
  share_domain: "your-domain.example"
  listen: ""
  remark: "vless-synology"
  clients:
    - name: "client1"
      uuid: ""      # empty -> generated and kept in /etc/x-ui/node-state.json
      flow: ""      # e.g. xtls-rprx-vision, leave empty for compatibility

reality:
  # Pick a domain that is plausible for THIS site and supports TLS 1.3.
  # Example below is for a Russian site. For other countries choose a local one.
  target: "www.yandex.ru:443"
  server_names: ["www.yandex.ru"]
  private_key: ""   # empty -> generated by `xray x25519`
  public_key: ""    # empty -> derived/stored
  short_ids: []     # empty -> one random shortId
  fingerprint: "chrome"
  spider_x: "/"

socks:
  enabled: true
  listen: "0.0.0.0"
  port: 10888
  auth: "noauth"    # noauth | password
  username: ""
  password: ""

subscription:
  enabled: true
  domain: "your-domain.example"
  port: 10889            # sub server listen port
  external_port: 10889   # port used in subscription URLs
  path: "/sub/"          # use a secret path, e.g. "/a1b2c3d4/"
  # Optional sub-server TLS (mount certs under /config/certs):
  # cert_file: "/config/certs/sub.crt"
  # key_file:  "/config/certs/sub.key"

xray:
  # How client traffic leaves the node:
  #   tailscale-socks -> Tailscale exit node (VPS) via local SOCKS5 (recommended)
  #   vps-socks       -> VPS xray-socks 100.116.29.54:1080 through Tailscale
  #   direct          -> home/office ISP (no VPS), for testing
  outbound: "tailscale-socks"
  tailscale_socks_host: "127.0.0.1"
  tailscale_socks_port: 1055
  vps_socks_address: "100.116.29.54"
  vps_socks_port: 1080
  test_url: "https://www.gstatic.com/generate_204"

routing:
  # Empty lists: everything goes through xray.outbound.
  # For a Russian site you can use:
  #   direct_geosite: ["geosite:category-ru"]
  #   direct_geoip:   ["geoip:ru"]
  direct_domains: []
  direct_geosite: []
  direct_geoip: []

mss:
  enabled: true
  value: 1360

gso:
  off: false
